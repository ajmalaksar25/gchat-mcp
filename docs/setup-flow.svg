<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">How setup works</title>
  <desc id="d">Five steps in the browser in Google Cloud: create a project, turn on the Chat and People APIs, name the Chat app, set up the sign-in screen, download the key file. Then the setup command saves the key file, opens the Google sign-in, checks the connection and prints the config for your AI assistant.</desc>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ink { fill: #1f2328; } .mute { fill: #59636e; }
    .lane { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
    .t { font-size: 15px; font-weight: 600; } .s { font-size: 13px; }
    .num { font-size: 14px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
  </defs>
  <rect width="1200" height="470" rx="20" fill="#ffffff"/>

  <!-- lane 1 -->
  <text x="40" y="48" class="ui lane ink">In your browser · Google Cloud console (about 8 minutes, once)</text>
  <g class="ui">
    <g transform="translate(40,70)">
      <rect width="208" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="14" fill="#59636e"/><text x="28" y="35" text-anchor="middle" class="num">1</text>
      <text x="16" y="72" class="t ink">Create a project</text>
      <text x="16" y="96" class="s mute">A free folder for the</text><text x="16" y="113" class="s mute">sign-in settings</text>
    </g>
    <g transform="translate(270,70)">
      <rect width="208" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="14" fill="#59636e"/><text x="28" y="35" text-anchor="middle" class="num">2</text>
      <text x="16" y="72" class="t ink">Turn on 2 APIs</text>
      <text x="16" y="96" class="s mute">Google Chat API and</text><text x="16" y="113" class="s mute">People API</text>
    </g>
    <g transform="translate(500,70)">
      <rect width="208" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="14" fill="#59636e"/><text x="28" y="35" text-anchor="middle" class="num">3</text>
      <text x="16" y="72" class="t ink">Name the Chat app</text>
      <text x="16" y="96" class="s mute">Name, icon link and</text><text x="16" y="113" class="s mute">description, then Save</text>
    </g>
    <g transform="translate(730,70)">
      <rect width="208" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
      <circle cx="28" cy="30" r="14" fill="#59636e"/><text x="28" y="35" text-anchor="middle" class="num">4</text>
      <text x="16" y="72" class="t ink">Sign-in screen</text>
      <text x="16" y="96" class="s mute">Get started, Audience:</text><text x="16" y="113" class="s mute">Internal, Create</text>
    </g>
    <g transform="translate(960,70)">
      <rect width="200" height="120" rx="12" fill="#e6f4ea" stroke="#137333"/>
      <circle cx="28" cy="30" r="14" fill="#137333"/><text x="28" y="35" text-anchor="middle" class="num">5</text>
      <text x="16" y="72" class="t ink">Download key file</text>
      <text x="16" y="96" class="s mute">Desktop app client,</text><text x="16" y="113" class="s mute">Download JSON</text>
    </g>
  </g>
  <g stroke="#8c959f" stroke-width="2" marker-end="url(#a)">
    <line x1="250" y1="130" x2="266" y2="130"/><line x1="480" y1="130" x2="496" y2="130"/>
    <line x1="710" y1="130" x2="726" y2="130"/><line x1="940" y1="130" x2="956" y2="130"/>
  </g>
  <path d="M1060 192 V232 H140 V262" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="600" y="224" text-anchor="middle" class="ui s mute">client_secret_....json in your Downloads folder</text>

  <!-- lane 2 -->
  <text x="40" y="292" class="ui lane ink">In the terminal · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500">uvx --python 3.13 google-chat-mcp setup</tspan> (or your AI assistant runs it)</text>
  <g class="ui">
    <g transform="translate(40,312)">
      <rect width="260" height="110" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="18" y="38" class="t ink">Save the key file</text>
      <text x="18" y="64" class="s mute">Copied to ~/.config/gchat-mcp/,</text><text x="18" y="82" class="s mute">readable only by you</text>
    </g>
    <g transform="translate(320,312)">
      <rect width="260" height="110" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="18" y="38" class="t ink">Sign in with Google</text>
      <text x="18" y="64" class="s mute">Your work account, click Allow.</text><text x="18" y="82" class="s mute">"Not verified"? It's yours: Continue</text>
    </g>
    <g transform="translate(600,312)">
      <rect width="260" height="110" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="18" y="38" class="t ink">Check</text>
      <text x="18" y="64" class="s mute">One read-only call:</text><text x="18" y="82" class="s mute">"Ready: 37 conversations found"</text>
    </g>
    <g transform="translate(880,312)">
      <rect width="280" height="110" rx="12" fill="#e6f4ea" stroke="#137333"/>
      <text x="18" y="38" class="t ink">Add to your assistant</text>
      <text x="18" y="64" class="s mute">Claude Code, Codex, Claude Desktop</text><text x="18" y="82" class="s mute">or Cursor: config printed for you</text>
    </g>
  </g>
  <g stroke="#8c959f" stroke-width="2" marker-end="url(#a)">
    <line x1="302" y1="367" x2="316" y2="367"/><line x1="582" y1="367" x2="596" y2="367"/><line x1="862" y1="367" x2="876" y2="367"/>
  </g>
  <text x="40" y="452" class="ui s mute">Optional, asked at the end: SubQ triage (off unless you add a key) and a footer under messages you send.</text>
</svg>
