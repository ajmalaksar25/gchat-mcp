[project]
name = "gchat-mcp"
version = "0.2.0"
description = "Local stdio MCP server for Google Chat (user OAuth, GA REST API)"
requires-python = ">=3.13"
dependencies = ["mcp>=1.12,<2", "google-auth>=2.30", "google-auth-oauthlib>=1.2", "requests>=2.32"]

[project.scripts]
gchat-mcp = "gchat_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]  # a named lambda is fine here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E402"]  # pytest fixtures are imported then used as arguments; some tests import late
