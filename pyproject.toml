[project]
name = "gchat-mcp"
version = "0.2.0"
description = "Local stdio MCP server for Google Chat (user OAuth, GA REST API)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajmal Aksar" }]
keywords = ["mcp", "model-context-protocol", "google-chat", "google-workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.13"
dependencies = ["mcp>=1.12,<2", "google-auth>=2.30", "google-auth-oauthlib>=1.2", "requests>=2.32"]

[project.urls]
Homepage = "https://github.com/ajmalaksar25/gchat-mcp"
Issues = "https://github.com/ajmalaksar25/gchat-mcp/issues"
Changelog = "https://github.com/ajmalaksar25/gchat-mcp/blob/main/CHANGELOG.md"

[project.scripts]
gchat-mcp = "gchat_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license fields
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]  # a named lambda is fine here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E402"]  # pytest fixtures are imported then used as arguments; some tests import late
