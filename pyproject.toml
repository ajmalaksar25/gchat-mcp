[project]
name = "gchat-mcp"
version = "0.2.0"
description = "Local stdio MCP server for Google Chat (user OAuth, GA REST API)"
requires-python = ">=3.13"
dependencies = ["mcp>=1.12,<2", "google-auth>=2.30", "google-auth-oauthlib>=1.2", "requests>=2.32"]

[project.scripts]
gchat-mcp = "gchat_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
